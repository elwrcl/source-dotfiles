unbindall

// --- BINDS ---
bind "`"            "toggleconsole"
bind "1"            "slot1"
bind "2"            "slot2"
bind "3"            "slot3"
bind "4"            "slot4"
bind "x"            "slot5"
bind "-"            "jointeam 2" //SUR
bind "="            "jointeam 3" //INF
bind "k"            "show_menu menu"

// --- MOVEMENT ---
bind "CTRL"         "+duck"
bind "SPACE"        "+jump"
bind "SHIFT"        "+speed"
bind "e"            "+use"
bind "r"            "+reload; r_cleardecals"
bind "f"            "+zoom"

// --- COMBAT ---
bind "MOUSE1"       "+attack"
bind "MOUSE2"       "+attack2"
bind "MWHEELUP"     "+jump"
bind "MWHEELDOWN"   "+jump"

// --- COMM ---
bind "y"            "messagemode"
bind "p"            "messagemode2"    
bind "alt"          "+voicerecord"   
bind "z"            "+mouse_menu QA"
bind "m"            "chooseteam"
bind "ESCAPE"       "cancelselect"
bind "F1"           "Vote Yes"
bind "F2"           "Vote No"

// --- MISC ---
bind "MOUSE3"       "impulse 100" 
bind "t"            "impulse 201"
bind "i"            "toggle mat_monitorgamma 2.2 1.6"
bind "["            "sv_pausable 0"
bind "]"            "sv_pausable 1"
bind "q"            "lastinv"
bind "v"            "toggle cl_viewmodelfovsurvivor 95 180"
bind "c"            "go_away_from_keyboard"
bind "b"            "kick Rochelle; kick Nick; kick Ellis; kick Coach; kick Zoey; kick Francis; kick Bill; kick Louis"
bind "h"            "exec autoexec.cfg"   
bind "UPARROW"      "cl_interp 0.0302; cl_interp_ratio 1; echo NET_COMP"
bind "DOWNARROW"    "cl_interp 0; cl_interp_ratio 2; echo NET_OFFICIAL"
bind "LEFTARROW"    "+left"
bind "RIGHTARROW"   "+right"
bind "W" "+mfwd"
bind "A" "+mleft"
bind "S" "+mback"
bind "D" "+mright"

// --- MOVEMENT ALIASES ---
alias +mfwd "-back;+forward;alias checkfwd +forward"
alias +mback "-forward;+back;alias checkback +back"
alias +mleft "-moveright;+moveleft;alias checkleft +moveleft"
alias +mright "-moveleft;+moveright;alias checkright +moveright"
alias -mfwd "-forward;checkback;alias checkfwd none"
alias -mback "-back;checkfwd;alias checkback none"
alias -mleft "-moveleft;checkright;alias checkleft none"
alias -mright "-moveright;checkleft;alias checkright none"
alias checkfwd "none"
alias checkback "none"
alias checkleft "none"
alias checkright "none"
alias none ""

// NETGRAPH
bind "TAB" "+scoregraph"
alias +scoregraph "+showscores; net_graph 4"
alias -scoregraph "-showscores; net_graph 0"
