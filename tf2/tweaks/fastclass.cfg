// for %75 keyboard layout

alias class1 "join_class scout"
alias class2 "join_class soldier"
alias class3 "join_class pyro"
alias class4 "join_class demoman"
alias class5 "join_class heavyweapons"
alias class6 "join_class engineer"
alias class7 "join_class medic"
alias class8 "join_class sniper"
alias class9 "join_class spy"

alias +class_modifier "bind 1 class1; bind 2 class2; bind 3 class3; bind 4 class4; bind 5 class5; bind 6 class6; bind 7 class7; bind 8 class8; bind 9 class9"
alias -class_modifier "bind 1 +all_primary; bind 2 +all_secondary; bind 3 slot3; bind 4 slot4; bind 5 slot5; bind 6 slot6; bind 7 slot7; bind 8 slot8; bind 9 slot9"

bind "RCTRL" "+class_modifier"