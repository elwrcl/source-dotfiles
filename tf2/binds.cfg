///////////////////////////////
// elarsın muhteşem bindları //
///////////////////////////////

// Movement
bind "w" "+forward"
bind "a" "+moveleft"
bind "s" "+back"
bind "d" "+moveright"
bind "space" "+all_jump"
bind "shift" "+all_duck"
bindtoggle "z" tf_use_min_viewmodels // important for larping :)

// Shortcuts
bind "ctrl" "+special_move"
bind "q"    "+quick_weapon"
bind "f"    "voicemenu 2 1" // battle cry
bind "x"    "voicemenu 0 1" // thx 
bind "c"    "voicemenu 0 6" // da 
bind "v"    "voicemenu 0 7" // nyet
bind "CAPSLOCK" "+inspect"
bind "r"    "+reload"
bind "f4"   "show_quest_log"

// M-Attacks
bind "mouse1" "+all_attack"
bind "mouse2" "+all_attack2"
bind "mouse3" "+all_attack3"
bind "mouse4" "+all_melee"
bind "mwheelup"   "+jump"
bind "mwheeldown" "+jump"
bind "h" "+use_action_slot_item"

// Misc
bind "l" "dropitem"
bind "m" "open_charinfo_direct"
bind "n" "open_charinfo_backpack"
bind "t" "impulse 201" // spray
bind "enter" "messagemode"
bind "u" "messagemode2"
bind "p" "say_party"
bind "g" "+taunt"
bind "," "changeclass"
bind "." "changeteam"
bind "TAB" "+showscores"
bind "ESCAPE" "cancelselect"
bind "i" "player_ready_toggle"
bind "b" "+quickswitch"
bind "j" "askconnect_accept"
bind "1" "+all_primary"
bind "2" "+all_secondary"
bind "3" "slot3"
bind "4" "slot4"
bind "5" "slot5"
bind "6" "slot6"
bind "7" "slot7"
bind "8" "slot8"
bind "9" "slot9"
bind "0" "slot10"

// Shortcut2
bind "F5" "screenshot"
bind "F6" "save_replay"
bind "F7" "abuse_report_queue"
bind "F12" "toggleconsole"

// Comms
bind "alt" "voicemenu 1 1" // zpy
bind "e" "voicemenu 0 0"   // doktor
bind "kp_ins" "voice_menu_1"
bind "kp_home" "voice_menu_2"
bind "kp_pgup" "voice_menu_3"
bind "LEFTARROW" "spec_next"
bind "RIGHTARROW" "spec_prev"

// kill bind
bind "k"			"kill"

// Shortcut3
bind "KP_PLUS" "cl_trigger_first_notification"
bind "KP_MINUS" "cl_decline_first_notification"
bind "F1" "hud_reloadscheme"
bind "F2" "spectate"

// Chatsupressor
bind SEMICOLON silencio
alias silencio silencio1
alias silencio1 "hud_saytext_time 0; voice_modenable 0; echo [elwrclcfg] Voice/Chat-OFF; playgamesound spy.dominationscout07; alias silencio silencio2"
alias silencio2 "hud_saytext_time 12; voice_modenable 1; echo [elwrclcfg] Voice/Chat-ON; playgamesound scout.specialcompleted12; alias silencio silencio1"

// VMScaller
alias F_Noviewabajo "bind UPARROW F_70; bind DOWNARROW error; r_drawviewmodel 0"
alias F_70 "bind UPARROW F_75; bind DOWNARROW F_Noviewabajo; viewmodel_fov 70; r_drawviewmodel 1"
alias F_75 "bind UPARROW F_80; bind DOWNARROW F_70; viewmodel_fov 75"
alias F_80 "bind UPARROW F_85; bind DOWNARROW F_75; viewmodel_fov 80"
alias F_85 "bind UPARROW F_90; bind DOWNARROW F_80; viewmodel_fov 85"
alias F_90 "bind UPARROW F_95; bind DOWNARROW F_85; viewmodel_fov 90"
alias F_95 "bind UPARROW F_100; bind DOWNARROW F_90; viewmodel_fov 95"
alias F_100 "bind UPARROW F_105; bind DOWNARROW F_95; viewmodel_fov 100"
alias F_105 "bind UPARROW F_110; bind DOWNARROW F_100; viewmodel_fov 105"
alias F_110 "bind UPARROW F_Noviewarriba; bind DOWNARROW F_105; viewmodel_fov 110; r_drawviewmodel 1"
alias F_Noviewarriba "bind UPARROW error; bind DOWNARROW F_110; r_drawviewmodel 0"

// start state matches viewmodel_fov 70 from autoexec
bind UPARROW F_75
bind DOWNARROW F_Noviewabajo

alias error "echo [elwrclcfg] viewmodel fov limit reached"

// AFK SCRIPT
wait 101;echo [elwrclcfg] AFK Script Initialized!
alias +afk "+left;echo [elwrclcfg] AFK ON;+attack;slot3;+moveleft ;voicemenu 2 2"
alias -afk "-left;echo [elwrclcfg] AFK OFF;-attack;slot1;-moveleft ;voicemenu 2 5"
alias toggle_afk "toggle_afk1"
alias toggle_afk1 "+afk;alias toggle_afk toggle_afk2"
alias toggle_afk2 "-afk; alias toggle_afk toggle_afk1"

// Voteix bugfix.
alias votei "echo Select map with vote1, vote2, or vote3."
alias vote1 "next_map_vote 0"
alias vote2 "next_map_vote 1"
alias vote3 "next_map_vote 2"
