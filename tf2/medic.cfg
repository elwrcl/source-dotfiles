// Medic

exec allclasses
bind "backspace" "exec medic" // Reload

alias autocall_initial "hud_medicautocallersthreshold 50" //autocall helprr1
alias autocall_temp "hud_medicautocallersthreshold 99" //autocall helprr2
alias +autocall_temp_hit "autocall_temp"
alias -autocall_temp_hit "autocall_initial"

alias +charge "+attack2;slot2;dropitem;autocall_initial"
alias -charge "-attack2"

+cur_primary
-cur_primary

echo #-#-# Medic config has been initialized. #-#-#
