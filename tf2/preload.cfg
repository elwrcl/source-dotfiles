// basic preloader for custom content.
// Launch-only: add "+exec preload" to TF2 launch options. Not exec'd from autoexec,
// so re-running autoexec in-game won't load a map and kick you off the server.

mod_load_anims_async 0
mod_load_mesh_async 0
mod_load_vcollide_async 0
mod_touchalldata 1
mod_forcedata 1
map itemtest; wait 5; disconnect; wait 3; echo "[copint] booted! kext will be pre-loaded!"
map_background preload_room; wait 10; disconnect; wait 3; echo "[copint] initialization complete! starting xserver 2nd custom content check complete!"
// restore async loading from gfx.cfg now that preloading is done
mod_load_anims_async 1
mod_load_mesh_async 1
mod_load_vcollide_async 1